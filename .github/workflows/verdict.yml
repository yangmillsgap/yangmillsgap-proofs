name: verdict

on:
  workflow_run:
    workflows: ["check"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  verdict:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the default branch only, never the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download the verdict artifact as data
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verdict
          path: verdict-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Comment, merge accepted proofs and tell the desk
        env:
          GH_TOKEN: ${{ github.token }}
          HOOK_HMAC_SECRET: ${{ secrets.HOOK_HMAC_SECRET }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          ARTIFACT_DIR: verdict-artifact
          FLEET_BOT_LOGIN: ${{ vars.FLEET_BOT_LOGIN }}
          FLEET_HANDLE: ${{ vars.FLEET_HANDLE }}
        run: node tools/verdict.mjs
